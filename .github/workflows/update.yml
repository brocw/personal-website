name: Refresh feeds & projects

on:
  schedule:
    - cron: "17 13 */2 * *" # every other day, 13:17 UTC (~9am Eastern)
  workflow_dispatch: # manual "Run workflow" button
  push:
    branches: [main]
    paths: [tools/update.mjs, index.html, content/**]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch sources and render index.html
        run: node tools/update.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes (DigitalOcean redeploys on push)
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A index.html data assets
          git commit -m "chore: refresh feeds & projects"
          git push
